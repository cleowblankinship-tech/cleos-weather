<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD60A">
<title>Cleo's Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-weather="clear" data-time="day">
<div id="scene" aria-hidden="true"></div>

<main id="app">
  <header class="top">
    <button id="locBtn" class="pill" aria-label="Change location">
      <span id="locName">Locating…</span> <span aria-hidden="true">▾</span>
    </button>
    <button id="unitBtn" class="pill pill--alt" aria-label="Toggle units">°F</button>
  </header>

  <section class="hero card" id="hero">
    <div class="hero__icon" id="heroIcon">☀️</div>
    <div class="hero__temp"><span id="temp">--</span><sup>°</sup></div>
    <h1 class="hero__headline" id="headline">Hang on…</h1>
    <p class="hero__sub" id="subline"></p>
    <div class="hero__range"><span id="hi">H --°</span><span id="lo">L --°</span><span id="feels">Feels --°</span></div>
  </section>

  <section class="card card--hourly">
    <h2>Next 24 hours</h2>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="card card--daily">
    <h2>This week</h2>
    <ul class="daily" id="daily"></ul>
  </section>

  <section class="tiles" id="tiles"></section>

  <footer>Data by <a href="https://open-meteo.com/">Open-Meteo</a></footer>
</main>

<dialog id="locDialog">
  <form method="dialog" class="dlg">
    <h2>Where to?</h2>
    <input id="search" type="search" placeholder="Search a city" autocomplete="off">
    <ul id="results"></ul>
    <h3>Saved</h3>
    <ul id="saved"></ul>
    <div class="dlg__row">
      <button type="button" id="geoBtn" class="pill">📍 Use my location</button>
      <button class="pill pill--alt">Close</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
